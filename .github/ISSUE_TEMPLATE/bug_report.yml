name: Signaler un bug
description: Décrire un comportement incorrect et reproductible.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Partie concernée
      options:
        - Task Manager
        - Atelier débutant
        - Documentation
        - CI et outillage
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Expliquez clairement ce qui ne fonctionne pas.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Lancer...
        2. Cliquer sur...
        3. Observer...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Versions de Node.js, Angular, navigateur et système utilisées.
  - type: textarea
    id: logs
    attributes:
      label: Message d'erreur ou capture
      render: shell
