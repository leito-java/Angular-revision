name: Angular CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  task-manager:
    name: Tests et build du Task Manager
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projets/task-manager

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: projets/task-manager/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Compiler l'application
        run: npm run build

  atelier-debutant:
    name: Build des six étapes débutantes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projets/atelier-debutant

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: projets/atelier-debutant/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler toutes les étapes
        run: npm run build:all
